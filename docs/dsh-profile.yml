# 由 scripts/export_profile.py 从 team.json 生成，请勿手改。
# 重新生成：python scripts/export_profile.py --out docs/dsh-profile.yml
# 装法：把下面 profiles: 的内容合并进 ~/.dsh/profiles/<你的 profile>/cordis.patch.yml
# 调用：/agent-teams --profile paper-pipeline <你的研究目标>

# 安装前必读：本团队 9 人，超出 AgentTeams 插件默认 maxMembers=8。
# 在同一个 cordis.patch.yml 的 agent-teams 条目里加上 maxMembers: 9，
# 否则 --profile 创建团队时报「has 9 members but maxMembers is 8」。
# 示例：
#   - id: agent-teams
#     name: "@nanmicoder/dsh-agent-teams"
#     config:
#       maxMembers: 9

profiles:
  paper-pipeline:
    description: "9 成员论文写作流水线（13 个任务）：选题开题 → 文献精读 → 深度调研 → 实证分析（计量 / 问卷二选一或并行）→ 图表设计 → 全文写作 → 独立审查 → 修订 → 去 AI 痕迹 → 候选定稿 → 差异复审 → 质量验收。写作与审查分离；返工闭环 maxRounds=2；t10 定稿后必过差异复审；每个任务带 objective/acceptance/deliverables/inScope 契约，换模型也不致质量大幅波动。"
    protocol: "9 成员论文写作流水线（13 个任务）：选题开题 → 文献精读 → 深度调研 → 实证分析（计量 / 问卷二选一或并行）→ 图表设计 → 全文写作 → 独立审查 → 修订 → 去 AI 痕迹 → 候选定稿 → 差异复审 → 质量验收。写作与审查分离；返工闭环 maxRounds=2；t10 定稿后必过差异复审；每个任务带 objective/acceptance/deliverables/inScope 契约，换模型也不致质量大幅波动。\n\n【流程硬规则】\n1. 【写作与审查分离】t6 / t8 / t9 由 paper-supervisor 承担，t7 由 academic-reviewer 承担，两者不得为同一成员；t7 的审查者也不得是 t3 的调研者（deep-researcher），避免审自己的贡献。\n2. 【验收独立且后置】t11 独立于写作与修订；verdict=pass 方可交付。t11 判 fail 时退回 t8 的责任成员，不在验收环节改稿。\n3. 【返工闭环】t7 verdict≠pass → 回到 t6 重写，重走 t6→t7，而不是直接进 t8。t8 只在 t7 给出 needs_revision 且缺陷可局部修补时承接。\n4. 【轮次上限】maxRounds=2。第 2 轮 t7 仍 fail，captain\n…（完整规则见 team.json）"
    taskPlanning: seed
    members:
      - name: "research-orchestrator"
        role: "研究总控：选题开题、实证路径判定、完整性核查与候选定稿"
        model: "deepseek-v4.1-flash-sg"
        reasoning_effort: "max"
      - name: "corpus-archivist"
        role: "文献精读与归档：逐篇精读建可核对读档、写文献综述、引文落库"
        model: "deepseek-v4.1-flash"
      - name: "deep-researcher"
        role: "深度调研：领域全景、方法对比、创新点核查、GAP 定位（只做调研，不做审查）"
        model: "deepseek-v4.1-flash-sg"
        reasoning_effort: "max"
      - name: "empirical-analyst"
        role: "计量实证：数据清洗、识别策略、稳健性、结果表格、复现包（二手/面板/宏观数据路径）"
        model: "deepseek-v4.1-flash-sg"
      - name: "survey-analyst"
        role: "问卷与量表分析：数据清理、信度效度、因子分析、方差分析、回归、中介与调节、SPSS/lavaan 实现（问卷路径）"
        model: "deepseek-v4.1-flash-sg"
      - name: "figure-designer"
        role: "图表设计：图表规划、绘制、三线表、PPT 版图（依赖实际结果，不画占位图）"
        model: "deepseek-v4.1-flash"
      - name: "paper-supervisor"
        role: "写作、修订与文体处置：全文写作、引言专项、润色、按审查意见修订、去 AI 痕迹"
        model: "deepseek-v4.1-flash-sg"
        reasoning_effort: "max"
      - name: "academic-reviewer"
        role: "独立学术审查：只审不写。对成稿做出内容、逻辑、方法、创新性的对抗式评审并给出可执行缺陷清单"
        model: "deepseek-v4.1-flash-sg"
        reasoning_effort: "max"
      - name: "quality-gatekeeper"
        role: "合规验收与差异复审：引注合规、格式编号、表文数字一致、差异漂移、复现包、引文真实性"
        model: "deepseek-v4.1-flash-sg"
    tasks:
      - id: "t1"
        subject: "选题开题"
        assignee: "research-orchestrator"
        description: "【类型】需求/开题（requirements）\n【目标】把选题收敛成一个可执行的研究设计：研究问题、理论框架、核心假设、数据来源、目标期刊、实证路径判定。\n【验收标准】\n  1. 研究问题一句话说得清，且能用一句话回答「凭什么值得发」\n  2. 核心假设写成可检验形式（自变量 / 因变量 / 机制 / 边界条件齐备）\n  3. 目标期刊已锁定 1 主 2 备，并列出该刊近 3 年 3 篇同主题文章作为标杆\n  4. 明确判定实证路径：计量（t4）/ 问卷与量表（t4b）/ 两者都要 / 都不需要，并说明依据\n  5. 给出不含实证情形下的替代论证方案\n【交付物】00-brief/brief.md（研究设计全文）；00-brief/empirical-path.md（路径判定与依据）；00-brief/target-journals.md（目标刊与标杆文章）\n【可改动范围】paper/<slug>/00-brief\n【不要做】文献综述全文（属 t2/t3）；任何正文写作"
      - id: "t2"
        subject: "文献精读"
        assignee: "corpus-archivist"
        description: "【类型】普通工作（work）\n【目标】把 t1 锁定的文献逐篇读透并落成可回查的读档，形成可直接引用的文献综述素材库。\n【验收标准】\n  1. 每篇文献一条读档，含出处（作者/篇名/刊名/年/卷期/页码或 DOI）与原文可定位页码\n  2. 每条判断标注引文原文（≤50 字），不得转述后当引文\n  3. 综述按争议点组织，不按时间罗列\n  4. 读不到的文献标 unverified，不得凭标题臆断内容\n【交付物】10-literature/corpus/*.md（逐篇读档）；10-literature/review-matrix.md（争议点矩阵）；10-literature/bibliography.bib 或 refs.json（引文库）\n【可改动范围】paper/<slug>/10-literature"
        dependencies:
          - "t1"
      - id: "t3"
        subject: "深度调研"
        assignee: "deep-researcher"
        description: "【类型】普通工作（work）\n【目标】给出领域全景、方法谱系与真实 GAP，证明本题目的创新点不是自说自话。\n【验收标准】\n  1. GAP 用「已有研究做到了 X，没做到 Y，本文补 Y，因此能带来 Z」三段式写清\n  2. 方法对比表至少覆盖 4 条路线，并说明本文为何选这条\n  3. 近 5 年高被引与最新进展都要有，不能只引经典\n  4. 每条判断附来源，无来源的判断标为待核\n【交付物】10-literature/landscape.md（领域全景与 GAP）；10-literature/method-comparison.md（方法对比）；10-literature/novelty-check.md（创新点自证）\n【可改动范围】paper/<slug>/10-literature\n【备注】t3 的产出同时是 t1 创新点主张的验伪入口：若 novelty-check 判定创新点不成立，回报 captain 退回 t1。"
        dependencies:
          - "t1"
      - id: "t4"
        subject: "计量实证"
        assignee: "empirical-analyst"
        description: "【类型】实现/分析（implementation）\n【目标】完成识别策略下的主回归与稳健性检验，产出可复算的结果表与复现包。\n【验收标准】\n  1. 识别假设写清并给出可检验的证据（平行趋势 / 第一阶段 F / 断点密度等）\n  2. 主结果 + 至少 3 组稳健性 + 至少 1 组安慰剂\n  3. 表内每个数字都能由 30-analysis 脚本一键复算得出\n  4. 异质性分析事先声明切分维度，不得事后挑显著\n  5. 所有 p 值报告精确值，不写 p<0.05 了事\n【交付物】20-data/data-dictionary.md；30-analysis/run_all.py 或 run_all.do（一键复算）；30-analysis/results/*.csv；30-analysis/tables.md（结果表，三线表格式）；30-analysis/robustness.md\n【可改动范围】paper/<slug>/20-data；paper/<slug>/30-analysis\n【校验命令】python paper/<slug>/30-analysis/run_all.py；python scripts/verify_paper.py --selftest\n【启用条件】t1 判定为需要计量实证（二手/面板/宏观数据）"
        dependencies:
          - "t1"
      - id: "t4b"
        subject: "问卷与量表分析"
        assignee: "survey-analyst"
        description: "【类型】实现/分析（implementation）\n【目标】完成问卷数据的信度效度检验、因子结构确认与假设模型检验，产出可直接进正文的结果表。\n【验收标准】\n  1. 样本描述：回收率、有效样本量、人口学分布，缺失值处理方式写明\n  2. 信度：总量表与各维度的 Cronbach's α（或 CR）逐个报告，α<0.7 的维度要么修正要么弃用并说明\n  3. 效度：KMO + Bartlett、EFA 载荷矩阵、CFA 拟合指标（χ²/df、RMSEA、CFI、TLI、SRMR）齐备；报告 AVE 与 CR，收敛效度 AVE>0.5、区分效度 √AVE>相关系数\n  4. 共同方法偏差：Harman 单因素 + 至少一种程序或统计补救\n  5. 假设检验：报告系数、标准误、Bootstrap 95% CI（中介必用 BCa，≥5000 次），不只看 p 值\n  6. 所有统计量都能由 30-analysis 脚本一键复算\n【交付物】20-data/data-dictionary.md；30-analysis/analysis.R 或 analysis.py（一键复算）；30-analysis/results/*.csv；30-analysis/reliability-validity.md；30-analysis/tables.md（描述统计、信效度、相关矩阵、回归、中介效应分解）\n【可改动范围】paper/<slug>/20-data；paper/<slug>/30-analysis\n【校验命令】python paper/<slug>/30-analysis/analysis.py；python scripts/verify_paper.py --selftest\n【启用条件】t1 判定为问卷/量表路径（与 t4 可并存；纯质性研究走 t3 的质性分支，不跑本任务）"
        dependencies:
          - "t1"
      - id: "t5"
        subject: "图表设计"
        assignee: "figure-designer"
        description: "【类型】普通工作（work）\n【目标】把已有结果转成符合目标期刊规范的图表与三线表，不新造数据、不加装饰。\n【验收标准】\n  1. 每张图表有规划说明：要证明什么、对应正文哪一段、数据来自哪个结果文件\n  2. 所有图的数据点可追溯到 30-analysis/results 的具体单元格\n  3. 三线表无竖线，表注含样本量、显著性说明、数据来源\n  4. 图内文字字号在打印缩至单栏后仍 ≥7pt，中文不出现方框或乱码\n【交付物】40-figures/figure-plan.md（图表规划表）；40-figures/src/*（绘图源文件）；40-figures/out/*.png 或 *.pdf（导出图）；40-figures/tables.md（三线表）\n【可改动范围】paper/<slug>/40-figures\n【依赖剪枝】按 t1 的路径判定，dependsOn 改为以下之一：\n  · 只跑计量路径（t4b 跳过） → ['t3', 't4']\n  · 只跑问卷路径（t4 跳过） → ['t3', 't4b']\n  · 两条路径都跳过（纯理论/综述型） → ['t3']\n【依赖策略】all（全部上游完成才开工）\n【备注】问卷路径（t4b 执行）时，依赖改为 [\"t3\",\"t4b\"]；t4 与 t4b 都执行时为 [\"t3\",\"t4\",\"t4b\"]。图表必须基于真实结果，不得先画占位图。"
        dependencies:
          - "t3"
          - "t4"
          - "t4b"
      - id: "t6"
        subject: "全文写作"
        assignee: "paper-supervisor"
        description: "【类型】实现/分析（implementation）\n【目标】按目标期刊体例写出结构完整、论证闭合的初稿，每个结论都能追到 t2/t3/t4/t4b 的证据。\n【验收标准】\n  1. 结构完整：题目、摘要、关键词、引言、文献与假设、研究设计、结果、讨论、结论、参考文献齐备\n  2. 每个假设在结果部分有对应检验，每个结论在证据部分有出处，无悬空论断\n  3. 摘要字数与关键词个数符合目标刊要求\n  4. 引注格式统一（GB/T 7714-2015 或目标刊体例，二选一并全程一致）\n  5. 正文出现的每个数字都能在 30-analysis 结果表中找到同值单元格\n【交付物】50-draft/v1/manuscript.md；50-draft/v1/claims-evidence-map.md（论断 → 证据对照表）\n【可改动范围】paper/<slug>/50-draft\n【校验命令】python scripts/verify_paper.py stats paper/<slug>/50-draft/v1/manuscript.md；python scripts/verify_paper.py citations paper/<slug>/50-draft/v1/manuscript.md\n【依赖剪枝】按 t1 的路径判定，dependsOn 改为以下之一：\n  · 只跑计量路径（t4b 跳过） → ['t2', 't3', 't4', 't5']\n  · 只跑问卷路径（t4 跳过） → ['t2', 't3', 't4b', 't5']\n  · 两条路径都跳过（纯理论/综述型） → ['t2', 't3', 't5']\n【依赖策略】all（全部上游完成才开工）\n【备注】问卷路径时依赖改为 [\"t2\",\"t3\",\"t4b\",\"t5\"]。产出 v1，不得原地覆盖前版。"
        dependencies:
          - "t2"
          - "t3"
          - "t4"
          - "t4b"
          - "t5"
      - id: "t7"
        subject: "独立审查"
        assignee: "academic-reviewer"
        description: "【类型】评审门禁（review）\n【目标】以对抗式评审视角找出初稿在问题价值、论证逻辑、方法效度、创新性、表达上的真实缺陷，给出可执行的修改要求。\n【验收标准】\n  1. verdict 三选一：pass / needs_revision / reject，且 pass 必须四维全过\n  2. 每条 finding 必须含：位置（页/段/表号）、问题、为什么是问题、具体怎么改\n  3. 至少给出 3 条 high 及以上级别问题，若确实没有须逐条说明为何已达标\n  4. 不得修改稿件本身；只出意见\n【交付物】60-review/r1/review.md（评审意见，含 verdict 与 finding 清单）\n【可改动范围】paper/<slug>/60-review\n【禁止】禁；止；修；改； ；5；0；-；d；r；a；f；t； ；下；任；何；文；件\n【被审任务】t6\n【评审轮次】第 1 轮\n【最多返工】2 轮"
        dependencies:
          - "t6"
      - id: "t8"
        subject: "修订"
        assignee: "paper-supervisor"
        description: "【类型】返修（repair）\n【目标】逐条回应 t7 的 finding，产出 v2 与逐条对照表；不接受的意见须给出拒绝理由。\n【验收标准】\n  1. t7 的每条 finding 都有编号对应处置：已改 / 部分改 / 不改（须说明理由）\n  2. 改动后的稿件另存 v2，不覆盖 v1\n  3. 对照表能让未读原文的人看出每条意见落在了哪一段\n【交付物】50-draft/v2/manuscript.md；60-review/r1/response-to-review.md（逐条对照表）\n【可改动范围】paper/<slug>/50-draft；paper/<slug>/60-review\n【校验命令】python scripts/verify_paper.py all paper/<slug>/50-draft/v2/manuscript.md --results paper/<slug>/30-analysis/results\n【评审轮次】第 1 轮"
        dependencies:
          - "t7"
      - id: "t9"
        subject: "去 AI 痕迹"
        assignee: "paper-supervisor"
        description: "【类型】返修（repair）\n【目标】在不改变事实、数字、引注与论证结构的前提下，消除模板腔与 AI 文体特征，产出 v3。\n【验收标准】\n  1. 只改表达不改事实：v2→v3 的数字、单位、引注、结论零漂移，逐项比对通过\n  2. AI 特征词与句式（综上/首先其次最后/不仅而且/值得注意的是等）密度显著下降并给出前后计数\n  3. 无防御性写作（「需要指出的是」「值得一提的是」）与过度解释\n  4. 段落有长短节奏，不出现连续 5 段同长度\n【交付物】50-draft/v3/manuscript.md；60-review/t9/style-diff.md（前后对照与计数）\n【可改动范围】paper/<slug>/50-draft；paper/<slug>/60-review\n【校验命令】python scripts/verify_paper.py all paper/<slug>/50-draft/v3/manuscript.md --results paper/<slug>/30-analysis/results"
        dependencies:
          - "t8"
      - id: "t10"
        subject: "候选定稿"
        assignee: "research-orchestrator"
        description: "【类型】集成（integration）\n【目标】做全局一致性收敛与体例统一，产出可送审的候选定稿 v4。\n【验收标准】\n  1. 摘要-引言-结果-结论四处的核心数字与结论一致\n  2. 章节号、图表号、交叉引用、参考文献序号全部连续且可解析\n  3. 术语与译名全文统一，缩写首次出现给全称\n  4. 体例统一到目标刊一份标准，不留混排\n【交付物】50-draft/v4/manuscript.md；50-draft/v4/final-check.md（定稿检查清单）\n【可改动范围】paper/<slug>/50-draft"
        dependencies:
          - "t9"
      - id: "t10.5"
        subject: "差异复审"
        assignee: "quality-gatekeeper"
